<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'">
<title>AI作業レポート</title>
<style>
@page { size: A4 portrait; margin: 20mm 18mm 16mm; }
:root {
  --ink: #231815;
  --sub: #655E5B;
  --line: #E7DEDA;
  --soft: #FAF8F6;
  --chapter: #F2EFEC;
  --red: #C7161D;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--chapter); color: var(--ink); counter-reset: chapter;
  font: 9.6pt/1.63 "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  print-color-adjust: exact; -webkit-print-color-adjust: exact;
}
h1, h2, h3, p, figure, ol { margin: 0; }
h1, h2, h3 { line-height: 1.35; font-weight: 900; }
h2 { font-size: 21pt; margin-bottom: 4mm; }
h3 { font-size: 11pt; margin: 4mm 0 1mm; }
h2, h3, figcaption { break-after: avoid; }
code { font-family: ui-monospace, monospace; }
.num, .score-num, .pctnum, .page::before { font-family: Inter, -apple-system, sans-serif; font-variant-numeric: tabular-nums; }
.page {
  width: min(210mm, 100%); min-height: 297mm; margin: 7mm auto;
  padding: 20mm 18mm 16mm; background: #fff; position: relative; counter-increment: chapter;
}
.page::before {
  content: counter(chapter, decimal-leading-zero); position: absolute; top: 10mm; right: 18mm;
  color: var(--chapter); font-size: 62pt; font-weight: 800; line-height: 1; pointer-events: none;
}
.page > :not(.pagefoot) { position: relative; }
.pagehead { margin-bottom: 4mm; color: var(--sub); font-size: 8.5pt; letter-spacing: .08em; }
.pagehead .t::before {
  content: ""; display: inline-block; vertical-align: .27em; width: 6mm; height: 1px;
  background: var(--ink); margin-right: 2mm;
}
.pagefoot { display: none; }
.lead, .intro { color: var(--sub); margin-bottom: 5mm; }
.note { font-size: 8pt; color: var(--sub); line-height: 1.55; margin: 3mm 0; overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; margin: 2mm 0 4mm; }
th, td { padding: 1.6mm 2mm; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
thead { display: table-header-group; }
thead th { border-bottom: 1.4pt solid var(--ink); font-size: 8.5pt; }
tr { break-inside: avoid; }

.cover h1 { font-size: clamp(28pt, 7vw, 40pt); line-height: 1.18; margin: 24mm 0 5mm; letter-spacing: .02em; }
.cover-date { border-top: 1px solid var(--line); margin-top: 12mm; padding-top: 3mm; font-size: 8.5pt; color: var(--sub); }
.scorerow {
  display: grid; grid-template-columns: minmax(0, 48mm) minmax(0, 1fr); gap: 8mm;
  align-items: center; border-top: 1.3pt solid var(--ink); border-bottom: 1px solid var(--line); padding: 6mm 0;
}
.scorebox .cap { font-size: 8.5pt; font-weight: 700; }
.score-ring { width: 38mm; position: relative; margin: 2mm 0 3mm; }
.score-ring svg { display: block; width: 100%; fill: none; stroke: var(--line); stroke-width: 4; }
.score-ring .progress { stroke: var(--ink); transform: rotate(-90deg); transform-origin: 60px 60px; }
.score-ring > div { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; }
.score-num { font-size: 35pt; line-height: 1; font-weight: 850; }
.of, .judged, .withheld-note { font-size: 8pt; color: var(--sub); }
.now { font-weight: 800; margin-bottom: 1mm; }
figcaption { font-weight: 800; margin-bottom: 1mm; }
.pillars { margin: 0; }
.pillars th { font-size: 9pt; white-space: nowrap; padding-left: 0; }
.pillars td { vertical-align: middle; }
.pillars .barcell { width: 100%; }
.track { background: var(--line); height: 2.5mm; }
.track > div { background: var(--ink); height: 100%; }
.insufficient .fill { background: repeating-linear-gradient(135deg, var(--sub) 0 1px, var(--line) 1px 3px); }
.pt { white-space: nowrap; font-size: 8pt; }
.pctnum { display: block; font-size: 7.5pt; color: var(--sub); }
.withheld-note { margin: 2mm 0; }

.next3 { list-style: none; padding: 0; margin-top: 9mm; display: grid; gap: 5mm; }
.next3 li {
  display: grid; grid-template-columns: 15mm 1fr; gap: 6mm; align-items: start; break-inside: avoid;
  border: 1px solid var(--line); border-top: 1.2pt solid var(--red); background: var(--soft); padding: 6mm;
}
.next3 .n { font-size: 23pt; color: var(--red); line-height: 1; font-weight: 850; }
.next3 b { font-size: 13pt; }
.next3 p { color: var(--sub); font-size: 8pt; margin-top: 2mm; }
.prompt-example { margin-top: 3mm; padding-top: 2mm; border-top: 1px solid var(--line); }
.prompt-example span { font-size: 8pt; font-weight: 700; color: var(--sub); }
.prompt-example blockquote { margin: 1mm 0 0; font-size: 9pt; line-height: 1.6; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
.kpi { padding: 3mm 2mm; }
.kpi + .kpi { border-left: 1px solid var(--line); }
.kpi .k, .auto .k { font-size: 8pt; color: var(--sub); }
.kpi .v, .auto .v { font-size: 17pt; line-height: 1.3; font-weight: 800; }
.kpi .u, .auto .u, .kpi .d { font-size: 8pt; color: var(--sub); }
.chart { margin: 5mm 0; break-inside: avoid; }
.chart .cap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1mm 3mm; font-size: 8.5pt; }
.chart svg { display: block; width: 100%; height: 32mm; margin-top: 1mm; }
.chart .bar { fill: var(--ink); }
.chart .bar.zero { fill: var(--line); }
.chart .axis, .chart .grid { stroke: var(--line); }
.chart .grid { stroke-dasharray: 3 3; }
.chart text { fill: var(--sub); font-size: 9px; }
.breadth { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8mm; }
.brow { display: grid; grid-template-columns: 24mm 1fr auto; gap: 2mm; align-items: center; font-size: 8pt; margin-bottom: 1.5mm; }
.auto { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm; }

.pillar-head { display: flex; justify-content: space-between; padding: 2mm 0; color: var(--sub); border-top: 1px solid var(--line); }
.items { table-layout: fixed; font-size: 9pt; }
.items .mk { width: 9mm; text-align: center; padding-left: 0; }
.items .mk span {
  display: inline-grid; place-items: center; width: 5.5mm; height: 5.5mm; border: 1px solid var(--ink);
  border-radius: 50%; font-size: 9pt; font-weight: 800;
}
.items .pass .mk span { background: var(--ink); color: #fff; }
.items .unmeasured .mk span { border-style: dashed; color: var(--sub); }
.items .judge { width: 32mm; font-size: 8pt; color: var(--sub); }
.items .note { width: 39mm; font-size: 8pt; color: var(--ink); }
.items .reason-row td { padding-top: 0; }
.items tbody.item { break-inside: avoid; }
.items .reason { font-size: 8pt; line-height: 1.55; color: var(--sub); overflow-wrap: anywhere; }
.items tr:has(+ .reason-row) td { border-bottom: 0; }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2mm; }
.statgrid .card { background: var(--soft); border-top: 1px solid var(--ink); padding: 2.5mm; break-inside: avoid; }
.statgrid .label { font-size: 8pt; color: var(--sub); }
.blindspots { padding-left: 5mm; }
.blindspots li { margin: 1.8mm 0; }
.shown-names { font-weight: 800; }

.catalog-group h3 { margin: 3mm 0 0; }
.catalog-group p { color: var(--sub); font-size: 8pt; }
.catalog-table { font-size: 9pt; margin: 1mm 0 2mm; }
.catalog-table th, .catalog-table td { padding: 1.25mm 2mm; }
.catalog-table tbody th { width: 38mm; font-weight: 600; }

.tree-diagram { border-top: 1.2pt solid var(--ink); }
.folder-tree, .folder-tree ul { list-style: none; padding: 0; margin: 0; }
.folder-tree > li + li { margin-top: 3mm; padding-top: 2mm; border-top: 1px solid var(--line); }
.folder-tree ul { margin-left: 4mm; border-left: 1px solid var(--sub); padding-left: 5mm; }
.folder-tree li { position: relative; padding-top: 1mm; }
.folder-tree ul > li::before { content: ""; position: absolute; top: 4.5mm; left: -5mm; width: 5mm; border-top: 1px solid var(--sub); }
.tree-node {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .5mm 4mm;
  padding: .7mm 2mm; background: var(--soft); border: 1px solid var(--line); break-inside: avoid;
}
.tree-node b { min-width: 23mm; }
.tree-node span { color: var(--sub); font-size: 8pt; }
.folder-tree > li > .tree-node { background: var(--ink); color: #fff; }
.folder-tree > li > .tree-node span { color: #fff; }

@media screen and (max-width: 650px) {
  .page { min-height: auto; margin: 0 auto 3mm; padding: 10mm 5mm; }
  .page::before { top: 3mm; right: 5mm; font-size: 42pt; }
  .cover h1 { margin-top: 13mm; }
  .scorerow, .breadth { grid-template-columns: 1fr; gap: 4mm; }
  .items .judge, .items .note { width: 19%; overflow-wrap: anywhere; }
  .next3 li { grid-template-columns: 10mm 1fr; gap: 3mm; padding: 4mm; }
  .kpis, .statgrid { grid-template-columns: 1fr 1fr; }
}
@media print {
  body { background: #fff; }
  .page { width: auto; min-height: 0; margin: 0; padding: 0; break-before: page; }
  .page:first-child { break-before: auto; }
  .page::before { top: 0; right: 0; }
  .cover h1 { font-size: 40pt; }
}
</style>
</head>
<body>
{{BODY}}
</body>
</html>
